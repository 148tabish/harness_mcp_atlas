[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbridge"
version = "0.1.0"
description = "Anthropic-shaped local proxy that translates to Amazon Bedrock Converse (GLM 5.3 via an application inference profile)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "httpx==0.27.2",
    "pydantic==2.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
bbridge = "bbridge.__main__:main"

[tool.setuptools.packages.find]
include = ["bbridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: real-endpoint smoke tests requiring BB_BEDROCK_API_KEY",
]
testpaths = ["tests"]
python_files = ["test_*.py", "smoke_*.py"]
