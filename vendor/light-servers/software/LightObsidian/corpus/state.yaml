contents:
  Daily/2026-05-26.md: '# 2026-05-26

    - Walk: Forsyth loop, 52 minutes.

    - Shop: glued the sideboard carcass; clamps off at 4.

    - SHPA: signed the docent letters.

    - Call Denise about Miles''s birthday.'
  Daily/2026-05-25.md: '# 2026-05-25

    - Church early service; deacons meeting after.

    - Sharpened the No. 4 and the jointer iron.

    - Read two chapters of the Vance novel.'
  Projects/Barrington sideboard.md: '# Barrington sideboard

    Walnut, Sheraton pattern. Due Oct 24.

    - Carcass glued.

    - Veneer stock selected.

    - Hardware ordered from the Charleston supplier.'
  Projects/Renard-Whitcomb chairs.md: '# Renard-Whitcomb Windsor chairs

    Six side chairs, due Jan 31.

    - Seat blanks milled.

    - Spindle stock riven and drying.'
  Projects/Historic Homes Tour.md: '# Historic Homes Tour

    Route: Bull to Gaston, six houses.

    - Owners confirmed: 5 of 6.

    - Booklet copy to Nathaniel Friday.'
  References/Finishing recipes.md: '# Finishing recipes

    - Garnet shellac: 2 lb cut, two coats, wax after a week.

    - Milk paint over oak: bond coat first.'
  References/Docent tour script.md: '# Docent tour script

    Open at the Charlton Street gate. Regency first, then the Victorian District block.'
  Inbox/quick capture.md: '- Order more hide glue.

    - Ruth Ann''s porch rail measurement.

    - Pound cake for Sunday.'
  Daily/2026-05-24.md: '# 2026-05-24

    - Long walk with Calvin.

    - Sketched the bookcase muntins.

    - Reviewed grant receipts for Priscilla.'

